<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Emma Dubois</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Fira+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0a0f0d;color:#e0e0e0;overflow-x:hidden}
    .nav{background:rgba(0,0,0,.95);backdrop-filter:blur(10px);padding:1.2rem 2rem;position:fixed;top:0;width:100%;z-index:1000;display:flex;justify-content:center;border-bottom:1px solid rgba(1,255,192,.2)}
    .nav ul{list-style:none;display:flex;gap:2rem;align-items:center}
    .nav a{color:#e0e0e0;text-decoration:none;font-family:'Fira Mono',monospace;font-weight:700;text-transform:uppercase;font-size:.85rem;position:relative}
    .nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#01ffc0;transition:width .3s}
    .nav a:hover{color:#01ffc0}
    .nav a:hover::after{width:100%}
    .hamburger{display:none;cursor:pointer;font-size:1.6rem;color:#e0e0e0}
    .contact-section{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6rem 2rem}
    .contact-card{max-width:600px;width:100%;background:rgba(30,42,36,.8);padding:3rem;border-radius:16px;border:1px solid rgba(1,255,192,.3);text-align:center}
    .contact-card h1{font-size:4rem;font-weight:900;background:linear-gradient(135deg,#fff,#01ffc0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2rem}
    .contact-info{margin:2rem 0;font-size:1.2rem}
    .contact-info div{margin:1.5rem 0}
    .contact-info strong{color:#01ffc0}
    .social{margin-top:3rem}
    .social a{margin:0 1rem;font-size:2rem;color:#01ffc0;transition:.3s}
    .social a:hover{transform:translateY(-5px);color:#00d9a3}
    footer{background:#000;padding:2rem;text-align:center;color:#666;font-size:.9rem;border-top:2px solid rgba(1,255,192,.3)}
    @media(max-width:768px){
      .hamburger{display:block}
      .nav ul{display:none;flex-direction:column;position:absolute;top:60px;left:0;width:100%;background:rgba(0,0,0,.98);padding:2rem}
      .nav ul.active{display:flex}
      .contact-card h1{font-size:3rem}
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="hamburger">☰</div>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="projets.html">Projets</a></li>
      <li><a href="veille.html">Veille Tech</a></li>
      <li><a href="glpi.html">GLPI</a></li>
      <li><a href="synthese.html">Synthèse</a></li>
      <li><a href="contacts.html">Contact</a></li>
    </ul>
  </nav>

  <section class="contact-section">
    <div class="contact-card">
      <h1>Contactez-moi</h1>
       <div class="contact-info">
  <div><strong>Email :</strong> sojavelodiary@gmail.com</div>
  <div><strong>Téléphone :</strong> +230 55 02 33 61</div>
  <div><strong>Localisation :</strong> Quatre Bornes, Maurice</div>
</div>

      <div class="social">
        <a href="https://linkedin.com/in/emma-dubois" target="_blank">LinkedIn</a>
        <a href="https://github.com/emma-dubois" target="_blank">GitHub</a>
      </div>
    </div>
  </section>

  <footer>© 2025 Emma Dubois - Tous droits réservés</footer>

  <script>
    const lenis = new Lenis({duration:1.4,smooth:true});
    function raf(t){lenis.raf(t);requestAnimationFrame(raf);}requestAnimationFrame(raf);
    document.querySelector('.hamburger').onclick=()=>document.querySelector('.nav ul').classList.toggle('active');
  </script>
</body>
</html>
